[package]
name = "agent-avatar-generator"
version = "0.1.0"
edition = "2021"
description = "Self-hosted avatar generation for AI agents — deterministic rendering, multiple styles, PNG/SVG output"
license = "MIT"

[lib]
name = "agent_avatar_generator"
path = "src/lib.rs"

[[bin]]
name = "agent-avatar-generator"
path = "src/main.rs"

[dependencies]
rocket = { version = "0.5", features = ["json"] }
rocket_cors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = "0.25"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
zip = { version = "8.1", default-features = false, features = ["deflate"] }
rayon = "1.10"
gif = "0.14.1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
image = "0.25"
